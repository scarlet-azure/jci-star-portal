<div id="tab-kpi" class="tab-content space-y-6 hidden">
    <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-6 space-y-6">
        <!-- HEADER FORM -->
        <div class="flex flex-col md:flex-row md:items-center justify-between border-b border-slate-200 pb-4 gap-4">
            <div>
                <span class="text-xs font-bold text-emerald-600 uppercase tracking-wider">Official Form 2026</span>
                <h2 class="text-2xl font-extrabold text-slate-900">Chapter KPI Self-Assessment Form</h2>
                <p class="text-xs text-slate-500 mt-0.5">Penilaian Mandiri KPI Chapter berdasarkan Kriteria & Template JCI Indonesia.</p>
            </div>
            <div class="flex items-center gap-3">
                <div class="bg-emerald-50 border border-emerald-200 rounded-xl px-4 py-2 text-right">
                    <span class="text-[10px] text-emerald-800 uppercase font-bold block">Estimated Score</span>
                    <div class="text-2xl font-black text-emerald-700" id="kpiScoreTotal">0 pts</div>
                    <span class="text-[10px] font-semibold text-slate-500" id="kpiStatusBadge">Status: Draft</span>
                </div>
            </div>
        </div>

        <!-- DYNAMIC TAB BUTTONS NAVIGATION -->
        <div id="dynamicKpiTabNav" class="flex items-center space-x-1 border-b border-slate-200 pb-2 overflow-x-auto no-scrollbar text-xs">
            <div class="p-2 text-slate-400 italic text-xs">Memuat kategori KPI...</div>
        </div>

        <!-- FORM UTAMA -->
        <form id="kpiSelfAssessmentForm" onsubmit="handleKPISubmit(event)" class="space-y-6 text-xs">
            
            <!-- DYNAMIC TAB CONTENTS CONTAINER -->
            <div id="dynamicKpiTabContainer" class="space-y-4">
                <div class="p-8 text-center text-slate-400 text-xs">Memuat struktur form KPI...</div>
            </div>

            <!-- ACTION BUTTONS DI BAWAH FORM KPI -->
            <div class="flex items-center justify-between pt-4 border-t border-slate-200">
                <p class="text-slate-400 text-[11px]">
                    <i class="fa-solid fa-floppy-disk text-slate-500"></i> Anda dapat menyimpan draft kapan saja sebelum melakukan submission final.
                </p>
                <div class="flex items-center space-x-2">
                    <button type="button" onclick="handleSaveDraftKpi(event)" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs rounded-xl transition">
                        <i class="fa-solid fa-floppy-disk mr-1.5"></i> Save Draft
                    </button>
                    <button type="button" onclick="handleSubmitKpiForm(event)" class="px-5 py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs rounded-xl transition shadow-xs">
                        <i class="fa-solid fa-paper-plane mr-1.5"></i> Submit KPI Form
                    </button>
                </div>
            </div>
        </form>
    </div>
</div>
