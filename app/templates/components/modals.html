<!-- SUBMISSION MODAL POPUP (PIC) -->
<div id="submissionModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl max-w-lg w-full p-6 space-y-4 shadow-2xl relative max-h-[90vh] overflow-y-auto">
        <div class="flex items-center justify-between border-b pb-3">
            <h3 class="font-bold text-slate-900 text-base" id="modalStdTitle">1. Chapter Leadership Update</h3>
            <button onclick="closeSubmissionModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
        </div>
        
        <form id="modalSubmissionForm" onsubmit="handleModalSubmit(event)" class="space-y-3 text-xs">
            <input type="hidden" id="modalStdId">
            <div>
                <label class="block font-semibold text-slate-700 mb-1">Submission Title *</label>
                <input type="text" id="modalSubTitle" required class="w-full p-2.5 bg-slate-50 border rounded-xl focus:outline-none focus:border-jci-blue">
            </div>
            <div>
                <label class="block font-semibold text-slate-700 mb-1">Description / Proof Summary *</label>
                <textarea id="modalSubDesc" required rows="3" class="w-full p-2.5 bg-slate-50 border rounded-xl focus:outline-none focus:border-jci-blue"></textarea>
            </div>
            <div>
                <label class="block font-semibold text-slate-700 mb-1">Target Submission Deadline</label>
                <input type="date" id="modalSubDeadline" class="w-full p-2.5 bg-slate-50 border rounded-xl focus:outline-none focus:border-jci-blue text-xs font-semibold text-slate-800 cursor-pointer">
            </div>
            <div>
                <label class="block font-semibold text-slate-700 mb-1">Evidence URL (Google Drive / PDF Link)</label>
                <input type="url" id="modalSubUrl" placeholder="https://jci.or.id/evidence/file.pdf" class="w-full p-2.5 bg-slate-50 border rounded-xl focus:outline-none focus:border-jci-blue">
            </div>
            <div>
                <label class="block font-semibold text-slate-700 mb-1">Upload File Evidence (PDF, PNG, JPG)</label>
                <div class="border-2 border-dashed border-slate-200 rounded-2xl p-4 text-center bg-slate-50 hover:bg-blue-50/50 transition cursor-pointer relative">
                    <input type="file" id="modalSubFile" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer" onchange="updateFileLabel(this)">
                    <i class="fa-solid fa-cloud-arrow-up text-jci-blue text-2xl mb-1"></i>
                    <p class="font-bold text-slate-700" id="fileSelectText">Click or drag & drop file to upload</p>
                    <p class="text-[10px] text-slate-400">Supported Formats: PDF, PNG, JPG (Max 10MB)</p>
                </div>
            </div>

            <div class="flex justify-end space-x-2 pt-2 border-t">
                <button type="button" onclick="closeSubmissionModal()" class="px-4 py-2 border rounded-xl text-slate-600 font-bold">Cancel</button>
                <button type="submit" class="px-5 py-2 bg-jci-blue text-white rounded-xl font-bold hover:bg-jci-navy">Submit Evidence</button>
            </div>
        </form>
    </div>
</div>

<!-- MODAL EDIT/ADD STANDARD (ADMIN) -->
<div id="standardModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl max-w-lg w-full p-6 space-y-4 shadow-2xl relative max-h-[90vh] overflow-y-auto">
        <div class="flex items-center justify-between border-b pb-3">
            <h3 class="font-bold text-slate-900 text-base" id="stdModalTitle">Add / Edit Standard</h3>
            <button onclick="closeStandardModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
        </div>
        
        <form id="standardForm" onsubmit="handleStandardFormSubmit(event)" class="space-y-3 text-xs">
            <input type="hidden" id="sFormMode" value="add">
            <div>
                <label class="block font-semibold text-slate-700 mb-1">Standard ID *</label>
                <input type="text" id="sId" required placeholder="e.g. EFF-15" class="w-full p-2.5 bg-slate-50 border rounded-xl focus:outline-none focus:border-jci-blue">
            </div>
            <div>
                <label class="block font-semibold text-slate-700 mb-1">Standard Title *</label>
                <input type="text" id="sName" required placeholder="Standard Name" class="w-full p-2.5 bg-slate-50 border rounded-xl focus:outline-none focus:border-jci-blue">
            </div>
            <div>
                <label class="block font-semibold text-slate-700 mb-1">Star Category *</label>
                <select id="sStar" required class="w-full p-2.5 bg-slate-50 border rounded-xl focus:outline-none focus:border-jci-blue font-semibold">
                    <option value="EFFICIENCY">EFFICIENCY</option>
                    <option value="NETWORK">NETWORK</option>
                    <option value="EXPERIENCE">EXPERIENCE</option>
                    <option value="OUTREACH">OUTREACH</option>
                    <option value="IMPACT">IMPACT</option>
                </select>
            </div>
            <div>
                <label class="block font-semibold text-slate-700 mb-1">Purpose / Description</label>
                <textarea id="sPurpose" rows="2" placeholder="Description of standard..." class="w-full p-2.5 bg-slate-50 border rounded-xl focus:outline-none focus:border-jci-blue"></textarea>
            </div>
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block font-semibold text-slate-700 mb-1">Max Score *</label>
                    <input type="number" id="sScore" required placeholder="10" class="w-full p-2.5 bg-slate-50 border rounded-xl focus:outline-none focus:border-jci-blue">
                </div>
                <div>
                    <label class="block font-semibold text-slate-700 mb-1">Deadline Target *</label>
                    <input type="date" id="sDeadline" required class="w-full p-2.5 bg-slate-50 border rounded-xl focus:outline-none focus:border-jci-blue">
                </div>
            </div>

            <div class="flex justify-end space-x-2 pt-3 border-t">
                <button type="button" onclick="closeStandardModal()" class="px-4 py-2 border rounded-xl text-slate-600 font-bold">Cancel</button>
                <button type="submit" class="px-5 py-2 bg-jci-blue text-white rounded-xl font-bold hover:bg-jci-navy">Save Standard</button>
            </div>
        </form>
    </div>
</div>

<!-- MODAL AUDIT SCORE (EVALUATOR) -->
<div id="auditModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl max-w-lg w-full p-6 space-y-4 shadow-2xl relative max-h-[90vh] overflow-y-auto">
        <div class="flex items-center justify-between border-b pb-3">
            <h3 class="font-bold text-slate-900 text-base flex items-center gap-2">
                <i class="fa-solid fa-clipboard-check text-amber-500"></i> Audit Chapter Submission
            </h3>
            <button onclick="closeAuditModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
        </div>
        
        <form id="auditForm" onsubmit="handleAuditFormSubmit(event)" class="space-y-3 text-xs">
            <input type="hidden" id="auditSubId">
            <div class="bg-slate-50 p-3.5 rounded-xl border space-y-1">
                <div class="font-extrabold text-slate-900 text-sm" id="auditModalTitle">-</div>
                <p class="text-slate-600" id="auditModalDesc">-</p>
                <div id="auditModalUrlContainer" class="pt-1"></div>
            </div>

            <div>
                <label class="block font-semibold text-slate-700 mb-1">Audit Decision / Status *</label>
                <select id="auditStatus" required onchange="handleAuditStatusChange(this.value)" class="w-full p-2.5 bg-slate-50 border rounded-xl font-bold focus:outline-none focus:border-jci-blue">
                    <option value="Approved">Approved (Terima & Beri Skor)</option>
                    <option value="Revision Requested">Revision Requested (Minta Revisi)</option>
                    <option value="Rejected">Rejected (Tolak)</option>
                </select>
            </div>

            <div id="auditScoreGroup">
                <label class="block font-semibold text-slate-700 mb-1">Awarded Score (Pts) *</label>
                <input type="number" id="auditScore" placeholder="10" class="w-full p-2.5 bg-slate-50 border rounded-xl focus:outline-none focus:border-jci-blue font-bold">
            </div>

            <div>
                <label class="block font-semibold text-slate-700 mb-1">Evaluator Notes / Feedback *</label>
                <textarea id="auditNotes" required rows="3" placeholder="Berikan catatan atau instruksi revisi untuk Chapter PIC..." class="w-full p-2.5 bg-slate-50 border rounded-xl focus:outline-none focus:border-jci-blue"></textarea>
            </div>

            <div class="flex justify-end space-x-2 pt-3 border-t">
                <button type="button" onclick="closeAuditModal()" class="px-4 py-2 border rounded-xl text-slate-600 font-bold">Cancel</button>
                <button type="submit" class="px-5 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl font-bold shadow-md">Submit Audit Result</button>
            </div>
        </form>
    </div>
</div>
